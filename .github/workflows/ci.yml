name: TIKEXO CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci

      - name: Lint ESLint
        working-directory: backend
        run: npm run lint

      - name: Lint TypeScript (web)
        working-directory: web
        run: |
          npm ci
          npm run type-check

  # ── 2. Tests unitaires ────────────────────────────────────────────────────
  test-unitaire:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Exécuter tests unitaires avec couverture
        working-directory: backend
        run: npm run test:unit -- --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'test-jwt-secret-tikexo-ci' }}

      - name: Upload coverage → Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: backend/coverage
          flags: unit
          fail_ci_if_error: false

  # ── 3. Tests d'intégration ────────────────────────────────────────────────
  test-integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: test-unitaire

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tikexo_test
          POSTGRES_USER: tikexo
          POSTGRES_PASSWORD: tikexo_test_pwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Prisma migrate (test DB)
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tikexo:tikexo_test_pwd@localhost:5432/tikexo_test

      - name: Exécuter tests d'intégration
        working-directory: backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://tikexo:tikexo_test_pwd@localhost:5432/tikexo_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'test-jwt-secret-tikexo-ci' }}
          FEDAPAY_WEBHOOK_SECRET: ''
          CLOUDINARY_URL: ''
          FIREBASE_PROJECT_ID: ''

  # ── 4. Tests de sécurité ─────────────────────────────────────────────────
  test-securite:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    needs: test-integration

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tikexo_security_test
          POSTGRES_USER: tikexo
          POSTGRES_PASSWORD: tikexo_test_pwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Prisma migrate (security test DB)
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tikexo:tikexo_test_pwd@localhost:5432/tikexo_security_test

      - name: Exécuter tests de sécurité
        working-directory: backend
        run: npm run test:security
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://tikexo:tikexo_test_pwd@localhost:5432/tikexo_security_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'test-jwt-secret-tikexo-ci' }}

  # ── 5. Tests E2E (Playwright) ─────────────────────────────────────────────
  test-e2e:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    needs: test-securite
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # backend/.env est dans .gitignore — jamais présent sur un runner CI —
      # mais docker-compose.dev.yml le référence via env_file, obligatoire
      # pour que le service démarre. .env.example est déjà aligné sur les
      # identifiants postgres/redis/minio de ce même docker-compose.dev.yml.
      - name: Préparer le fichier .env backend
        run: cp backend/.env.example backend/.env

      - name: Démarrer l'environnement de dev (docker compose)
        run: docker compose -f docker-compose.dev.yml up -d --wait
        timeout-minutes: 5

      - name: Installer Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Exécuter tests E2E
        working-directory: web
        run: npx playwright test e2e/
        env:
          BASE_URL: http://localhost:5173
          TEST_SUPER_ADMIN_PHONE: ${{ secrets.TEST_SUPER_ADMIN_PHONE }}
          TEST_RH_PHONE: ${{ secrets.TEST_RH_PHONE }}
          TEST_BENEF_PHONE: ${{ secrets.TEST_BENEF_PHONE }}

      - name: Upload rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Arrêter docker compose
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  # ── 6. Audit des dépendances ──────────────────────────────────────────────
  audit-dependances:
    name: Audit de sécurité npm
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit backend
        working-directory: backend
        run: |
          npm ci
          # Bloquer si vulnérabilité CRITIQUE détectée
          npm audit --audit-level=critical
          echo "Audit backend : OK"

      - name: Audit web
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=critical
          echo "Audit web : OK"

  # ── 7. Build Docker ───────────────────────────────────────────────────────
  # Garde-fou : vérifie que le Dockerfile backend reste buildable. Le VPS ne
  # consomme pas cette image (il build depuis les sources, voir deploy-
  # production ci-dessous) donc on ne pousse pas vers ghcr.io — l'installation
  # GitHub Actions de cette org n'a de toute façon pas le droit de créer des
  # packages ("installation not allowed to Create organization package").
  build-docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: [test-integration, audit-dependances]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Le driver "docker" par défaut ne supporte pas cache-to/cache-from
      # type=gha (voir cache-to plus bas) — il faut le driver docker-container,
      # fourni par ce builder buildx dédié.
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image backend (sans push)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: tikexo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 8. Déploiement production ─────────────────────────────────────────────
  # Le VPS construit l'image localement (docker-compose.prod.yml --build),
  # il ne consomme pas l'image poussée par build-docker sur ghcr.io — ce
  # job reste un simple garde-fou (le Dockerfile doit rester buildable).
  # L'entrypoint du conteneur "app" applique déjà les migrations Prisma au
  # démarrage (voir Dockerfile racine : migrate deploy && node src/index.js),
  # inutile de le refaire ici.
  deploy-production:
    name: Déploiement production (tikexo.kete.fr)
    runs-on: ubuntu-latest
    needs: [build-docker, test-e2e]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://tikexo.kete.fr

    steps:
      - uses: actions/checkout@v4

      - name: Déployer sur tikexo.kete.fr via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            cd /root/apps/tikexo

            echo "=== TIKEXO — Déploiement production ==="
            echo "SHA: ${{ github.sha }}"

            git pull origin main
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

            echo "Vérification santé..."
            for i in $(seq 1 12); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tikexo.kete.fr/health || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "Service sain après $((i * 5))s"
                docker image prune -f
                echo "=== Déploiement TIKEXO réussi ==="
                exit 0
              fi
              sleep 5
            done
            echo "ÉCHEC : service non sain après 60s"
            exit 1
